  for (var i = a.length - 1; i > 0; i--) { var j = randInt(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function fmt(n, d) { return Number(n).toFixed(d == null ? 0 : d); }

var stageEl;
function fitStage() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.min(vw / STAGE_W, vh / STAGE_H);
  var ox = (vw - STAGE_W * s) / 2, oy = (vh - STAGE_H * s) / 2;
  stageEl.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
  document.documentElement.style.setProperty('--stage-scale', s);
}
function stageScale() {
  var r = stageEl.getBoundingClientRect();
  return r.width / STAGE_W || 1;
}

/* ---------- 场景两层：固定远景 + 可横向无限滚动的草地带 ---------- */
function buildScenery(tileCount) {
  var wrap = mk('div', 'bg-wrap');
  var far = mk('div', 'bg-far');
  far.style.backgroundImage = 'url(' + IMGS.bgFar + ')';
  wrap.appendChild(far);

  var gw = mk('div', 'grass-wrap');
  var tiles = mk('div', 'grass-tiles');
  /* 正 / 镜像 / 正：周期 2×TILE，offset 落在 (-2×TILE,0] 时始终铺满 */
  for (var i = 0; i < tileCount; i++) {
    var t = mk('div', 'g-tile' + (i === 1 ? ' flip' : ''));
    t.style.left = (i * BG_TILE_W) + 'px';
    t.style.backgroundImage = 'url(' + IMGS.bgGrass + ')';
    tiles.appendChild(t);
  }
  gw.appendChild(tiles);
  wrap.appendChild(gw);
  return { wrap: wrap, tiles: tiles };
}

/* ---------- 屏幕管理 ---------- */
var Screens = {
  reg: {}, cur: null, curName: null,
  add: function (name, obj) { this.reg[name] = obj; obj.name = name; return obj; },
  show: function (name, opts) {
    if (this.curName === name) return;
    var nxt = this.reg[name];
    if (!nxt) return;
    if (this.cur && this.cur.exit) this.cur.exit();
    if (this.cur) this.cur.el.classList.remove('on');
    this.cur = nxt; this.curName = name;
    nxt.el.classList.add('on');
    if (nxt.enter) nxt.enter(opts || {});
  },
  tick: function (dt, t) { if (this.cur && this.cur.tick) this.cur.tick(dt, t); }
};

/* ---------- 输入（键盘 / 点按） ---------- */
var Input = {
  jumpHeld: false, slideHeld: false,
  onJump: null, onSlide: null, onAny: null,
  init: function () {
    var self = this;
    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      var k = e.key;
      if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'j' || k === 'J') {
        e.preventDefault(); self.trigger('jump');
      } else if (k === 'ArrowDown' || k === 's' || k === 'S' || k === 'Shift' || k === 'k' || k === 'K' || k === 'f' || k === 'F') {
        e.preventDefault(); self.trigger('slide');
      }
    }, { passive: false });
    window.addEventListener('keyup', function (e) {
      var k = e.key;
      if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') self.jumpHeld = false;
      if (k === 'ArrowDown' || k === 's' || k === 'S' || k === 'Shift') self.slideHeld = false;
    });
    window.addEventListener('pointerdown', function () { if (self.onAny) self.onAny(); }, { passive: true });
    window.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  },
  trigger: function (kind) {
    if (kind === 'jump') { this.jumpHeld = true; if (this.onJump) this.onJump(); }
    else { this.slideHeld = true; if (this.onSlide) this.onSlide(); }
  },
  release: function (kind) {
    if (kind === 'jump') this.jumpHeld = false; else this.slideHeld = false;
  }
};

/* ---------- 主循环 ---------- */
var Loop = {
  last: 0, acc: 0, running: true, frozen: false, fns: [],
  add: function (fn) { this.fns.push(fn); },
  start: function () {
    var self = this;
    function frame(ts) {
      requestAnimationFrame(frame);
      if (!self.last) self.last = ts;
      var dt = Math.min(0.05, (ts - self.last) / 1000);
      self.last = ts;
      if (self.frozen) dt = 0;
      self.t += dt;
      Screens.tick(dt, self.t);
      for (var i = 0; i < self.fns.length; i++) self.fns[i](dt, self.t);
    }
    this.t = 0;
    requestAnimationFrame(frame);
  }
};

/* 关卡参数（单位：舞台像素 / 秒） */
var CFG = {
  baseSpeed: 430,        // 自动奔跑速度
  penaltySpeed: 190,     // 碰撞/干扰后的减速
  penaltyTime: 1.15,     // 减速持续
  blindTime: 2.0,        // 桃花遮眼持续
  jumpV: 1060,           // 起跳初速度（顶点约 229px，滞空约 0.87s，横跨约 372px）
  gravity: 2450,         // 重力
  slideTime: 0.62,       // 滑行持续（横跨约 267px）
  startX: 1080,          // 第一片碎片出现的位置
  /* 间距必须以"一次起跳横跨 372px"为下限，否则跳一次就会跨过下一个东西、
     落地正好撞上。下面这些数值保证任意相邻两项都 ≥ 500px（约 1.16s）。 */
  pickupGap: 500,        // 碎片与下一个东西的最小间距
  pickupJitter: 55,      // 额外随机量（只加不减，保证不会突然变挤）
  highExtra: 200,        // 高轨碎片之后再加一段（它逼你起跳，必须留够落地时间）
  obGap: 700,            // 障碍之后的空档
  obEvery: 4,            // 每 N 片碎片夹一个障碍（20 片里 4~5 个）
  leadIn: 1.6,           // 开场倒计时
  decoyCount: 6,         // 干扰碎片数量
  entityAhead: 1500      // 提前生成/显示的距离
};

/* ---- 干扰碎片（两种，都取自本诗，看着像诗但不是原句） ----
   ①换字：把正确碎片里的一个字换成同一首诗别处出现的字（百花 -> 千花）
   ②颠倒：把正确碎片倒过来（百花 -> 花百）
   两者都保证不等于任何正确碎片，也互不重复。 */
function makeDecoys(frags, n) {
  var pool = {}, chars = [], i, k;
  for (i = 0; i < frags.length; i++) pool[frags[i]] = 1;
  for (i = 0; i < frags.length; i++) {
    var cs = frags[i].split('');
    for (k = 0; k < cs.length; k++) if (chars.indexOf(cs[k]) < 0) chars.push(cs[k]);
  }
  var out = [], guard = 0;
  function ok(s) {
    return !!s && s.length >= 2 && s.length <= 3 && !pool[s] && out.indexOf(s) < 0;
  }
  while (out.length < n && guard++ < 1200) {
    var f = pick(frags), s;
    if (Math.random() < 0.38) {
      s = f.split('').reverse().join('');                   // ② 颠倒
    } else {
      var arr = f.split('');
      var cands = [];
      for (k = 0; k < chars.length; k++) if (arr.indexOf(chars[k]) < 0) cands.push(chars[k]);
      if (!cands.length) continue;
      arr[randInt(arr.length)] = pick(cands);                // ① 换一个字
      s = arr.join('');
    }
    if (ok(s)) out.push(s);
  }
  return out;
}

/* ---- 构建一关的时间线 ----
   正确碎片【严格按诗序】出现：上方提示哪一片，路上才会驶来哪一片，拾完才轮到下一片。
   干扰碎片随机插在相邻两片正确碎片之间，看起来像诗但不是原句。 */
function buildLevel(poemIdx) {
  var P = POEMS[poemIdx];
  var frags = P.frags;

  var decoys = makeDecoys(frags, CFG.decoyCount);
  // 把 decoyCount 个干扰碎片随机分到「相邻两片正确碎片之间」的 11 个空档里
  var gaps = [], g;
  for (g = 0; g < frags.length - 1; g++) gaps.push(g);
  shuffle(gaps);
  var decoyAt = {};
  for (g = 0; g < decoys.length; g++) {
    var gi = gaps[g % gaps.length];
    decoyAt[gi] = (decoyAt[gi] || 0) + 1;
  }
  var all = [], di = 0, i, j;
  for (i = 0; i < frags.length; i++) {
    all.push({ kind: 'c', fi: i, text: frags[i] });
    var n = decoyAt[i] || 0;
    for (j = 0; j < n; j++) all.push({ kind: 'd', text: decoys[di++] });
  }

  var x = CFG.startX;
  var ents = [];
  var obIdx = 0;
  var justOb = false;
  for (var k = 0; k < all.length; k++) {
    var tk = all[k];
    // 高轨碎片必须起跳才够得着；紧随障碍之后一律放低轨，避免“跳完立刻又要跳”
    var lane = justOb ? 'low'
      : ((tk.kind === 'c') ? (Math.random() < 0.66 ? 'low' : 'high')
        : (Math.random() < 0.5 ? 'low' : 'high'));
    ents.push({
      type: 'pickup', kind: tk.kind, fi: tk.fi, text: tk.text,
      x: x, lane: lane, taken: false, missed: false, skipped: false
    });
    /* 到下一个东西的间距：基础 pickupGap + 只会加不会减的随机量；
       高轨碎片还要再拉长，因为它逼你起跳，落地后必须还有反应时间。 */
    var step = CFG.pickupGap + rand(0, CFG.pickupJitter);
    if (lane === 'high') step += CFG.highExtra;
    x += step;
    justOb = false;
    if (k % CFG.obEvery === CFG.obEvery - 1) {   // 每 N 片夹一个障碍
      ents.push({
        type: 'ob', ob: obIdx % 3 === 2 ? 'bird' : (obIdx % 2 === 0 ? 'rock' : 'bird'),
        x: x
      });
      obIdx++;
      x += CFG.obGap;
      justOb = true;
    }
  }
  var endX = x + 520;
  return { poemIdx: poemIdx, poem: P, ents: ents, endX: endX, total: frags.length };
}


/* ==================== 10-audio.js ==================== */
/* ===== 10-audio.js 程序化古风音律（无需任何音频素材） =====
   背景音乐：Karplus-Strong 拨弦合成古筝音色 + 五声调式旋律 + 梳状混响，离线渲染成 32 秒无缝循环。
   拾取音效：清脆铃音，音高沿五声音阶阶梯上行。
   碰撞 / 拾错：按需求不出声。 */

var Sfx = (function () {
  var AC = window.AudioContext || window.webkitAudioContext;
  var S = {
    ctx: null, master: null, musicBus: null, sfxBus: null,
    musicNode: null, muted: !!Store.get('muted', false), built: false, failed: false
  };

  var PENT = [0, 2, 4, 7, 9];                 // 宫商角徵羽
  var SCALE = [                               // D 宫五声，0 = D4
    293.66, 329.63, 369.99, 440.00, 493.88,
    587.33, 659.26, 739.99, 880.00, 987.77,
    1174.66, 1318.51
  ];

  function pluck(buf, sr, startSec, freq, durSec, amp, bright, damp) {
    var start = Math.round(startSec * sr), len = Math.round(durSec * sr);
    if (start >= buf.length) return;
    if (start + len > buf.length) len = buf.length - start;
    var N = Math.max(2, Math.round(sr / freq));
    var ring = new Float32Array(N), lp = 0, i;
    for (i = 0; i < N; i++) {
      var w = Math.random() * 2 - 1;
      lp = lp * (1 - bright) + w * bright;
      ring[i] = lp;
    }
    var mean = 0; for (i = 0; i < N; i++) mean += ring[i];
    mean /= N;
    for (i = 0; i < N; i++) ring[i] -= mean;

    var idx = 0, sm = 0;
    for (var n = 0; n < len; n++) {
      var cur = ring[idx], nx = ring[(idx + 1) % N];
      var v = (cur + nx) * 0.5 * damp;
      ring[idx] = v;
      sm = sm * 0.30 + v * 0.70;
      var t = n / len;
      var env = Math.exp(-2.4 * t) * (1 - t) * (1 - t) * (1 - Math.exp(-n / 45));
      buf[start + n] += sm * amp * env;
      idx = (idx + 1) % N;
    }
    // 高八度泛音，增加清脆感
    var bl = Math.min(len, Math.round(sr * 0.5));
    for (var m = 0; m < bl; m++) {
      var tt = m / bl;
      buf[start + m] += Math.sin(2 * Math.PI * freq * 2 * (m / sr)) * amp * 0.09 * Math.exp(-7 * tt) * (1 - tt);
    }
  }

  function comb(buf, sr, delay, g, mix, out) {
    var D = Math.round(delay * sr);
    if (D < 1 || D >= buf.length) return;
    var acc = 0;
    for (var i = D; i < buf.length; i++) {
      acc = buf[i] + acc * g;
      out[i] += acc * mix;
    }
  }

  function buildBGM() {
    var sr = 44100, beats = 32, bpm = 64;
    var beat = 60 / bpm, total = beats * beat;
    var n = Math.round(total * sr);
    var buf = new Float32Array(n);

    // 旋律 [音阶下标, 起始拍, 时值拍]
    var MEL = [
      [3, 0, 1], [4, 1, .5], [5, 1.5, .5], [3, 2, 1], [2, 3, 1],
      [1, 4, 1], [2, 5, .5], [3, 5.5, .5], [4, 6, 2],
      [5, 8, 1], [6, 9, .5], [5, 9.5, .5], [4, 10, 1], [3, 11, 1],
      [2, 12, 1], [1, 13, .5], [0, 13.5, 1.5],
      [5, 16, 1], [7, 17, .5], [6, 17.5, .5], [5, 18, 1], [4, 19, 1],
      [3, 20, 1], [2, 21, .5], [3, 21.5, .5], [4, 22, 2],
      [3, 24, 1], [2, 25, 1], [1, 26, 1], [0, 27, 2], [0, 29.5, 2.5]
    ];
    MEL.forEach(function (m) {
      pluck(buf, sr, m[1] * beat, SCALE[m[0]], Math.max(0.8, m[2] * beat * 1.5), 0.30, 0.52, 0.997);
    });

    // 低音：每小节骨干部（五度）
    var BASS = [[73.42, 110.00], [61.74, 92.50], [55.00, 82.41], [73.42, 110.00]];
    for (var b = 0; b < 8; b++) {
      var ch = BASS[b % 4], t0 = b * 4 * beat;
      pluck(buf, sr, t0, ch[0], 3.4 * beat, 0.34, 0.30, 0.9985);
      pluck(buf, sr, t0, ch[1], 2.6 * beat, 0.19, 0.30, 0.9985);
      pluck(buf, sr, t0 + 2 * beat, ch[0] * 2, 1.6 * beat, 0.11, 0.4, 0.997);
    }
    // 泛音点缀
    for (var k = 0; k < 16; k++) {
      pluck(buf, sr, (k * 2 + 1) * beat, SCALE[5 + (k % 4)], 1.1, 0.07, 0.7, 0.996);
    }

    // 混响
    var wet = new Float32Array(n);
    comb(buf, sr, 0.0297, 0.70, 0.30, wet);
    comb(buf, sr, 0.0451, 0.66, 0.24, wet);
    comb(buf, sr, 0.0709, 0.62, 0.18, wet);
    var peak = 0;
    for (var i = 0; i < n; i++) {
      buf[i] = buf[i] * 0.82 + wet[i] * 0.55;
      var a = Math.abs(buf[i]); if (a > peak) peak = a;
    }
    var k2 = peak > 0 ? 0.9 / peak : 1;
    for (i = 0; i < n; i++) buf[i] *= k2;
    // 首尾交叉淡化，保证循环无爆音
    var xf = Math.round(0.35 * sr);
    for (i = 0; i < xf; i++) {
      var t = i / xf;
      buf[i] = buf[i] * t + buf[n - xf + i] * (1 - t);
    }
    return { data: buf, sr: sr, len: total };
  }

  S.init = function () {
    if (S.ctx || S.failed || !AC) { if (!AC) S.failed = true; return; }
    try {
      S.ctx = new AC();
      S.master = S.ctx.createGain();
      S.master.gain.value = S.muted ? 0 : 1;
      S.master.connect(S.ctx.destination);
      S.musicBus = S.ctx.createGain(); S.musicBus.gain.value = 0.30; S.musicBus.connect(S.master);
      S.sfxBus = S.ctx.createGain(); S.sfxBus.gain.value = 0.62; S.sfxBus.connect(S.master);
    } catch (e) { S.failed = true; }
  };

  S.unlock = function () {
    S.init();
    if (!S.ctx) return;
    if (S.ctx.state === 'suspended') S.ctx.resume();
    if (!S.built) {
      S.built = true;
      setTimeout(function () {
        if (!S.ctx) return;
        try {
          var bgm = buildBGM();
          var ab = S.ctx.createBuffer(1, bgm.data.length, bgm.sr);
          ab.copyToChannel ? ab.copyToChannel(bgm.data, 0) : ab.getChannelData(0).set(bgm.data);
          var src = S.ctx.createBufferSource();
          src.buffer = ab; src.loop = true;
          var lp = S.ctx.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 5200; lp.Q.value = 0.4;
          src.connect(lp); lp.connect(S.musicBus);
          src.start();
          S.musicNode = src;
        } catch (e) { }
      }, 60);
    }
  };

  S.setMuted = function (m) {
    S.muted = !!m; Store.set('muted', S.muted);
    if (S.master) S.master.gain.setTargetAtTime(S.muted ? 0 : 1, S.ctx.currentTime, 0.05);
  };

  /* 拾取清脆音：五声阶梯上行 */
  S.chime = function (step) {
    if (!S.ctx || S.muted) return;
    var ctx = S.ctx, t0 = ctx.currentTime + 0.005;
    var semi = PENT[step % 5] + 12 * Math.floor(step / 5);
    var f = 1046.51 * Math.pow(2, semi / 12);
    if (f > 3200) f /= 2;
    function tone(freq, amp, dec, type, glide) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(glide ? freq * 0.93 : freq, t0);
      if (glide) o.frequency.exponentialRampToValueAtTime(freq, t0 + 0.045);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(amp, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
      o.connect(g); g.connect(S.sfxBus);
      o.start(t0); o.stop(t0 + dec + 0.03);
    }
    tone(f, 0.5, 0.62, 'sine', true);
    tone(f * 2.76, 0.13, 0.30, 'sine');
    tone(f * 1.5, 0.10, 0.20, 'triangle');
  };

  /* 自检：离线渲染一遍 BGM，确认合成没问题（供构建期/调试页核对） */
  S.selftest = function () {
    try {
      var b = buildBGM(), peak = 0, nz = 0, i;
      for (i = 0; i < b.data.length; i++) { var a = Math.abs(b.data[i]); if (a > peak) peak = a; }
      for (i = 0; i < b.data.length; i += 97) if (Math.abs(b.data[i]) > 0.002) nz++;
      return { ok: true, sec: +b.len.toFixed(1), peak: +peak.toFixed(3), energy: nz };
    } catch (e) { return { ok: false, err: e.message }; }
  };

  return S;
})();

/* ===== 30-play.js 横版自动跑酷主玩法 ===== */

var LAY = {
  PH: 300,                 // 少女显示高度
  PW: 0,                   // 由图片比例算出
  NS: 7,                   // 裙摆波浪切片数
  ROCK_W: 160, ROCK_H: 0,
  BIRD_W: 152, BIRD_H: 0,
  LOW_Y: 452,              // 低轨碎片中心（跑动即可拾取）
  HIGH_Y: 214,             // 高轨碎片中心（须起跳）
  BIRD_Y: 318,             // 飞鸟中心（高度固定，不上下浮动）
  GRASS_PAR: 1.0,          // 地面草随奔跑 1:1 移动（远景固定不动，脚不打滑）
  NEAR_H: 83,              // 近景草高度（源图 64 行 × 2 倍放大），压在画面最下沿
  NEAR_PAR: 1.62           // 近景草比地面草快，形成前景视差 → 风驰感
};

/* 花瓣粒子（桃花落下 + 常驻氛围） */
var Petals = {
  cv: null, ctx: null, list: [], amb: [], dust: [], rings: [], dpr: 1,
  init: function (cv) {
    this.cv = cv;
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = STAGE_W * this.dpr; cv.height = STAGE_H * this.dpr;
    this.ctx = cv.getContext('2d');
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    var self = this;
    this.amb = [];
    for (var i = 0; i < 18; i++) this.amb.push(this.mk(true));
  },
  /* 常驻落花：七成从右上桃树枝头飘下，三成自画面上缘零星洒落 */
  mk: function (ambient) {
    var tree = !!ambient && Math.random() < 0.72;
    return {
      x: tree ? rand(860, 1345) : rand(-40, STAGE_W + 40),
      y: tree ? rand(10, 300) : (ambient ? rand(-140, 90) : rand(-260, -20)),
      vy: tree ? rand(11, 30) : (ambient ? rand(16, 42) : rand(120, 300)),
      vx: tree ? rand(-42, -8) : rand(-26, 26),
      r: tree ? rand(4, 7.5) : (ambient ? rand(3.5, 6.5) : rand(5, 10)),
      rot: rand(0, 6.28), vr: rand(-2.2, 2.2),
      a: tree ? rand(.45, .8) : (ambient ? rand(.34, .6) : rand(.72, 1)),
      sw: tree ? rand(1.0, 2.2) : rand(.6, 1.7),
      ph: rand(0, 6.28), tree: tree
    };
  },
  burst: function (x, y, n) {
    for (var i = 0; i < n; i++) {
      var p = this.mk(false);
      p.x = x + rand(-70, 70); p.y = y + rand(-50, 30);
      p.vx = rand(-150, 150); p.vy = rand(-40, 170);
      this.list.push(p);
    }
    if (this.list.length > 260) this.list.splice(0, this.list.length - 260);
  },
  storm: function () {
    for (var i = 0; i < 78; i++) {
      var p = this.mk(false);
      p.x = rand(-80, STAGE_W + 80); p.y = rand(-460, -10);
      p.vy = rand(150, 330);
      this.list.push(p);
    }
  },

  /* 落地/急停时脚下一圈扩散的尘环 */
  emitRing: function (x, y, power) {
    power = power == null ? 1 : power;
    this.rings.push({ x: x, y: y, life: 0, max: .42, r0: 12 * power, r1: 82 * power, a: .34 });
    if (this.rings.length > 8) this.rings.shift();
  },
  stepRings: function (dt) {
    var c = this.ctx, i, p;
    for (i = this.rings.length - 1; i >= 0; i--) {
      p = this.rings[i];
      p.life += dt;
      if (p.life >= p.max) { this.rings.splice(i, 1); continue; }
      var t = p.life / p.max;
      var r = p.r0 + (p.r1 - p.r0) * (1 - Math.pow(1 - t, 2));
      c.save();
      c.globalAlpha = p.a * (1 - t) * (1 - t);
      c.strokeStyle = '#bcab8c';
      c.lineWidth = 6 * (1 - t) + 1.5;
      c.beginPath(); c.ellipse(p.x, p.y, r, r * 0.3, 0, 0, 6.2832); c.stroke();
      c.restore();
    }
  },

  /* ---- 脚下尘土与碎草屑 ---- */
  mkDust: function (grass) {
    return {
      grass: !!grass, x: 0, y: 0, vx: 0, vy: 0, life: 0,
      max: grass ? rand(.46, .80) : rand(.28, .52),
      r: grass ? rand(2.6, 5.0) : rand(4, 9),
      rot: rand(0, 6.28), vr: rand(-11, 11),
      a: grass ? rand(.62, .95) : rand(.30, .52),
      g: grass ? 920 : 240
    };
  },
  emitDust: function (x, y, nGrass, nPuff, power) {
    power = power == null ? 1 : power;
    var i, p;
    for (i = 0; i < nGrass; i++) {
      p = this.mkDust(true);
      p.x = x + rand(-16, 10); p.y = y + rand(-12, 2);
      p.vx = rand(-250, -60) * power; p.vy = rand(-280, -80) * power;
      this.dust.push(p);
    }
    for (i = 0; i < nPuff; i++) {
      p = this.mkDust(false);
      p.x = x + rand(-24, 18); p.y = y + rand(-8, 4);
      p.vx = rand(-150, -25) * power; p.vy = rand(-90, -10) * power;
      this.dust.push(p);
    }
    if (this.dust.length > 260) this.dust.splice(0, this.dust.length - 260);
  },
  stepDust: function (dt) {
    var c = this.ctx, i, p;
    for (i = this.dust.length - 1; i >= 0; i--) {
      p = this.dust[i];
      p.life += dt;
      if (p.life >= p.max) { this.dust.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.vx *= Math.max(0, 1 - 2.0 * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      var t = p.life / p.max;
      c.save();
      c.globalAlpha = p.a * (1 - t) * (1 - t * 0.35);
      c.translate(p.x, p.y);
      if (p.grass) {
        c.rotate(p.rot);
        c.fillStyle = '#7c9f4e';
        c.beginPath(); c.ellipse(0, 0, p.r * 1.9, p.r * .62, 0, 0, 6.2832); c.fill();
        c.globalAlpha *= 0.55;
        c.fillStyle = '#b6cf90';
        c.beginPath(); c.ellipse(-p.r * .3, -p.r * .22, p.r * .95, p.r * .3, 0, 0, 6.2832); c.fill();
      } else {
        var rr = p.r * (1 + t * 1.3);
        c.fillStyle = '#b09f81';
        c.beginPath(); c.arc(0, 0, rr, 0, 6.2832); c.fill();
        c.globalAlpha *= 0.55;
        c.fillStyle = '#8e7f68';
        c.beginPath(); c.arc(0, 0, rr * 0.55, 0, 6.2832); c.fill();
      }
      c.restore();
    }
  },
  step: function (dt, t) {
    var c = this.ctx;
    c.clearRect(0, 0, STAGE_W, STAGE_H);
    var i, p;
    for (i = 0; i < this.amb.length; i++) {
      p = this.amb[i];
      p.y += p.vy * dt;
      p.x += (p.vx + Math.sin(t * 0.9 + p.ph) * 26 * p.sw) * dt;
      p.rot += p.vr * dt * 0.6;
      if (p.y > STAGE_H + 30 || p.x < -70) { this.amb[i] = this.mk(true); continue; }
      this.draw(c, p);
    }
    for (i = this.list.length - 1; i >= 0; i--) {
      p = this.list[i];
      p.y += p.vy * dt;
      p.x += (p.vx + Math.sin(t * 2.4 + p.ph) * 52) * dt;
      p.vy += 90 * dt; p.rot += p.vr * 3 * dt;
      if (p.y > STAGE_H + 40) { this.list.splice(i, 1); continue; }
      this.draw(c, p);
    }
    this.stepDust(dt);
    this.stepRings(dt);
  },
  draw: function (c, p) {
    c.save();
    c.translate(p.x, p.y); c.rotate(p.rot);
    c.globalAlpha = p.a;
    c.fillStyle = '#f6c4d0';
    c.beginPath(); c.ellipse(0, 0, p.r, p.r * 0.62, 0, 0, 6.2832); c.fill();
    c.globalAlpha = p.a * 0.85;
    c.fillStyle = '#fde6ec';
    c.beginPath(); c.ellipse(-p.r * .22, -p.r * .12, p.r * .48, p.r * .3, 0, 0, 6.2832); c.fill();
    c.restore();
  }
};

var Play = {

      pt: $('.hud-left .pt', hud), pa: $('.hud-left .pa', hud), pp: $('.hud-left .pp', hud),
      mis: $('.mis', hud), col: $('.col', hud), bar: $('.run-bar i', hud),
      boxRow: $('.box-row', hud), promptRow: $('.prompt-row', hud), promptTxt: $('.prompt-row b', hud),
      bJump: bj, bSlide: bs, cv: pcv
    };

    Petals.init(pcv);

    /* 操作按钮 */
    function bindBtn(btn, kind) {
      btn.addEventListener('pointerdown', function (e) { e.preventDefault(); btn.classList.add('down'); Input.trigger(kind); });
      var up = function () { btn.classList.remove('down'); Input.release(kind); };
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('pointerleave', up);
      btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    }
    bindBtn(bj, 'jump'); bindBtn(bs, 'slide');

    /* 场地左右半屏也可操作：左跳右滑 */
    var stageEl2 = $('#stage');
    stageEl2.addEventListener('pointerdown', function (e) {
      if (Screens.curName !== 'play') return;
      if (e.target.closest && e.target.closest('.ctl, .corner-btn, .hot')) return;

    Input.onJump = function () { self.onJump(); };

    };

        e.h = d.offsetHeight || 56;
      } else {
        var d2 = mk('div', 'ent ob ' + e.ob);
        d2.innerHTML = '<img src="' + (e.ob === 'rock' ? IMGS.spriteRock : IMGS.spriteBird) + '" alt="">' +
          '<div class="shadow' + (e.ob === 'bird' ? ' air' : '') + '"></div>';
        self.dom.world.appendChild(d2);
        e.el = d2;
        if (e.ob === 'rock') { e.w = LAY.ROCK_W; e.h = LAY.ROCK_H; }
        else { e.w = LAY.BIRD_W; e.h = LAY.BIRD_H; }
        d2.style.width = e.w + 'px'; d2.style.height = e.h + 'px';
      }
      e.el.style.display = 'none';
    });

    /* 诗匣槽位 */
    var row = this.dom.boxRow;
    row.innerHTML = '';
    this.slots = lv.poem.frags.map(function (f, i) {
      var s = mk('div', 'slot empty');
      s.style.width = (18 * f.length + 26) + 'px';
      s.dataset.i = i;
      row.appendChild(s);
      return s;
    });

    this.dom.pt.textContent = '《' + lv.poem.title + '》';
    this.dom.pa.textContent = lv.poem.dynasty + '·' + lv.poem.author;
    this.dom.mis.textContent = '0'; this.dom.col.textContent = '0';
    this.dom.mis.className = 'mis zero'; this.dom.col.className = 'col zero';
    Petals.list.length = 0;
    Petals.dust.length = 0;
    Petals.rings.length = 0;
    this.refreshBox();
    Screens.show('play');
    this.toast('踏春寻句');
    if (DEBUG.freeze && !DEBUG.t) Loop.frozen = true; else Loop.frozen = false;

    /* 调试快进 */
    if (DEBUG.t) {
      var target = parseFloat(DEBUG.t) || 0;
      var step = 1 / 60, n = Math.round(target / step);
      for (var k = 0; k < n; k++) this.update(step);
      if (DEBUG.freeze) Loop.frozen = true;
    }
  },

  toast: function (txt, cls) {
    var t = this.dom.toast;
    t.textContent = txt;
    t.classList.remove('on');
    void t.offsetWidth;
    t.classList.add('on');
  },

  /* ---------- 操作 ---------- */
  onJump: function () {
    var s = this.st; if (!s || s.done) return;
    if (s.sliding) { s.sliding = false; s.slideT = 0; }
    if (s.onGround) {
      s.vy = CFG.jumpV; s.onGround = false;
      Petals.emitDust(PLAYER_X - 8, GROUND_Y, 7, 5, 1.0);      // 蹬地
    }
  },
  onSlide: function () {
    var s = this.st; if (!s || s.done) return;
    if (s.onGround) {
      if (!s.sliding) {
        Petals.emitDust(PLAYER_X - 14, GROUND_Y, 12, 9, 1.3);   // 急停俯身
        Petals.emitRing(PLAYER_X - 18, GROUND_Y - 2, 0.72);
      }
      s.sliding = true; s.slideT = CFG.slideTime;
    } else { s.vy -= 620; }                    // 空中下滑，快速落地
  },

  /* ---------- 逐帧 ---------- */
  update: function (dt) {
    var s = this.st; if (!s) return;
    s.time += dt;
    var t = s.time;

    /* 速度与减速 */
    if (s.slowT > 0) s.slowT -= dt;
    var target = s.slowT > 0 ? CFG.penaltySpeed : CFG.baseSpeed;
    s.speed = lerp(s.speed, target, 1 - Math.pow(0.0015, dt));
    s.dist += s.speed * dt;

    /* 跳跃 */
    if (!s.onGround) {
      s.vy -= CFG.gravity * dt;
      s.jumpY += s.vy * dt;
      if (s.jumpY <= 0) { s.jumpY = 0; s.vy = 0; s.onGround = true; }
    }
    /* 滑行 */
    if (s.sliding) { s.slideT -= dt; if (s.slideT <= 0) s.sliding = false; }

    /* 落地扬尘 + 跑动/滑行的持续草屑 */
    if (!s.onGround) s.wasAir = true;
    else if (s.wasAir) {
      s.wasAir = false;
      Petals.emitDust(PLAYER_X - 10, GROUND_Y, 17, 12, 1.25);
      Petals.emitRing(PLAYER_X - 12, GROUND_Y - 2, 1);
    }
    if (s.onGround) {
      s.runDustT += dt;
      var iv = s.sliding ? 0.05 : 0.155;
      if (s.runDustT >= iv) {
        s.runDustT = 0;
        var rush = s.slowT > 0 ? 1.2 : 1;
        if (s.sliding) Petals.emitDust(PLAYER_X - 24, GROUND_Y, 3, 4, 1.15 * rush);
        else Petals.emitDust(PLAYER_X - 14, GROUND_Y, Math.random() < 0.6 ? 2 : 1, 3, .7 * rush);
      }
    }
    /* 桃花遮眼 */
    if (s.blindT > 0) {
      s.blindT -= dt;
      if (s.blindT <= 0) this.dom.blind.classList.remove('on');
    }
    if (s.invuln > 0) s.invuln -= dt;

    /* 自动驾驶（验收截图用） */
    if (DEBUG.auto) this.autopilot();

    /* 玩家姿态 */
    var pw = LAY.PW, ph = LAY.PH;
    var bob = s.onGround ? Math.sin(t * 15) * 3.2 : 0;
    this.pEl.style.transform = 'translate3d(' + (PLAYER_X - pw / 2) + 'px,' +
      (GROUND_Y - ph - s.jumpY) + 'px,0)';
    var sc = s.sliding ? 'scaleY(.52) scaleX(1.1)' : (s.onGround ? 'scaleY(1) scaleX(1)' : 'scaleY(1.03) scaleX(.98) rotate(-5deg)');
    this.pInner.style.transform = sc + ' translateY(' + bob.toFixed(2) + 'px)';
    this.pEl.classList.toggle('slide', s.sliding);
    var amp = s.sliding ? 0.6 : 2.9;
    for (var i = 0; i < this.slices.length; i++) {
      var dx = Math.sin(t * 13 - i * 0.72) * amp * (0.35 + i / this.slices.length);
      this.slices[i].style.transform = 'translateX(' + dx.toFixed(2) + 'px)';
    }

    /* 碰撞盒：pbox 全身（撞障碍），kbox 躯干（拾取，让“起跳越过低轨干扰”成立） */
    var pbox = s.sliding
      ? { x: PLAYER_X - 52, y: GROUND_Y - 138 - s.jumpY, w: 104, h: 138 }
      : { x: PLAYER_X - 46, y: GROUND_Y - 268 - s.jumpY, w: 92, h: 268 };
    var kbox = s.sliding
      ? { x: PLAYER_X - 56, y: GROUND_Y - 142 - s.jumpY, w: 112, h: 142 }
      : { x: PLAYER_X - 52, y: GROUND_Y - 236 - s.jumpY, w: 104, h: 236 };

    /* 只有草地带滚动；远景（桃树、石头、石灯）保持不动 */
    var span = BG_TILE_W * 2;
    this.dom.tiles.style.transform =
      'translate3d(' + (-((s.dist * LAY.GRASS_PAR) % span)).toFixed(1) + 'px,0,0)';
    this.dom.near.style.transform =
      'translate3d(' + (-((s.dist * LAY.NEAR_PAR) % span)).toFixed(1) + 'px,0,0)';

    /* 实体 */
    var ents = s.lv.ents;
    for (var k = 0; k < ents.length; k++) {
      var e = ents[k];
      var sx = PLAYER_X + (e.x - s.dist);

      if (e.skipped) { e.el.style.display = 'none'; continue; }
      if (sx < -320 || sx > STAGE_W + 340) {
        if (e.el.style.display !== 'none') e.el.style.display = 'none';
        if (e.type === 'pickup' && e.kind === 'c' && !e.taken && sx < -320) this.markLost(e);
        continue;
      }
      if (e.el.style.display === 'none' && !e.taken) e.el.style.display = '';

      if (e.type === 'pickup') {
        if (e.taken) { e.el.style.display = 'none'; continue; }
        var cy = e.lane === 'high' ? LAY.HIGH_Y : LAY.LOW_Y;
        e.el.style.transform = 'translate3d(' + (sx - e.w / 2) + 'px,' + (cy - e.h / 2) + 'px,0)';
        if (sx < PLAYER_X - 120) this.markLost(e);
        /* 拾取判定 */
        var pb = { x: sx - e.w / 2, y: cy - e.h / 2, w: e.w, h: e.h };
        if (pb.x < kbox.x + kbox.w && pb.x + pb.w > kbox.x && pb.y < kbox.y + kbox.h && pb.y + pb.h > kbox.y) {
          this.take(e, sx, cy);
        }
      } else {
        var oy;
        if (e.ob === 'rock') {
          oy = GROUND_Y + 12 - e.h;
        } else {
          oy = LAY.BIRD_Y - e.h / 2;          // 飞鸟高度固定，不做浮动
        }
        e.el.style.transform = 'translate3d(' + (sx - e.w / 2) + 'px,' + oy + 'px,0)';
        if (e.hit) continue;
        var ob;
        if (e.ob === 'rock') ob = { x: sx - e.w / 2 + 22, y: oy + 10, w: e.w - 44, h: e.h - 12 };
        else ob = { x: sx - e.w / 2 + 22, y: oy + 20, w: e.w - 44, h: e.h - 42 };
        if (s.invuln <= 0 && ob.x < pbox.x + pbox.w && ob.x + ob.w > pbox.x && ob.y < pbox.y + pbox.h && ob.y + ob.h > pbox.y) {
          this.hitObstacle(e);
        }
      }
    }

    /* HUD */
    this.dom.bar.style.width = clamp(s.dist / s.lv.endX * 100, 0, 100) + '%';
    if (s.shake > 0) {
      s.shake -= dt * 3.4;
      var m = Math.max(0, s.shake) * 13;
      this.dom.world.style.transform = 'translate3d(' + rand(-m, m).toFixed(1) + 'px,' + rand(-m * .6, m * .6).toFixed(1) + 'px,0)';
    } else if (this.dom.world.style.transform) {
      this.dom.world.style.transform = '';
    }

    Petals.step(dt, t);

    if (!s.done && s.dist >= s.lv.endX) this.finish();
  },

  /* ---------- 碎片从身后溜走：提示必须跳到下一片，否则会一直卡在已错过的字上 ---------- */
  markLost: function (e) {
    var s = this.st;
    if (!e || e.missed) return;
    e.missed = true;
    if (e.kind === 'c' && !s.collected[e.fi] && !s.skipped[e.fi]) {
      s.skipped[e.fi] = true;
      this.refreshBox();
    }
  },

  /* ---------- 拾取 ---------- */
  take: function (e, sx, cy) {
    var s = this.st;
    e.taken = true;
    e.el.style.display = 'none';
    if (e.kind === 'c') {
      if (s.collected[e.fi]) return;
      s.collected[e.fi] = true;
      s.got++;
      Sfx.chime(s.got - 1);
      Petals.burst(sx, cy, 9);
      this.refreshBox();
      this.dom.promptRow.classList.remove('pop');
      void this.dom.promptRow.offsetWidth;
      this.dom.promptRow.classList.add('pop');
    } else {
      s.mistakes++;
      this.dom.mis.textContent = s.mistakes;
      this.dom.mis.className = 'mis';
      s.slowT = CFG.penaltyTime;
      s.blindT = CFG.blindTime;
      this.dom.blind.classList.add('on');
      this.dom.blind.classList.remove('flash');
      void this.dom.blind.offsetWidth;
      this.dom.blind.classList.add('flash');
      Petals.storm();
      s.shake = 0.7;
      this.toast('拾错了，桃花迷眼');
    }
  },

  hitObstacle: function (e) {
    var s = this.st;
    e.hit = true;
    s.collisions++;
    s.invuln = 1.0;
    s.slowT = CFG.penaltyTime;
    s.shake = 1.0;
    this.dom.col.textContent = s.collisions;
    this.dom.col.className = 'col';
    this.pEl.classList.remove('hit');
    void this.pEl.offsetWidth;
    this.pEl.classList.add('hit');
    /* 撞到障碍 -> 下一个诗句碎片彻底消失 */
    var nxt = null;
    for (var i = 0; i < s.lv.ents.length; i++) {
      var q = s.lv.ents[i];
      if (q.type !== 'pickup' || q.kind !== 'c' || q.taken || q.skipped) continue;
      if (q.x > s.dist + 260) { nxt = q; break; }
    }
    if (nxt) {
      nxt.skipped = true;
      s.skipped[nxt.fi] = true;
      this.refreshBox();
      this.toast('踉跄，错失「' + nxt.text + '」');
    } else {
      this.toast('踉跄，脚步滞缓');
    }
  },

  /* ---------- HUD 刷新 ---------- */
  refreshBox: function () {
    var s = this.st;
    if (!s) return;
    var nextIdx = -1;
    for (var i = 0; i < s.frags.length; i++) {
      var sl = this.slots[i];
      if (s.collected[i]) {
        sl.className = 'slot filled';
        sl.textContent = s.frags[i];
      } else if (s.skipped[i]) {
        sl.className = 'slot skipped';
        sl.textContent = '';
      } else {
        sl.className = 'slot empty';
        sl.textContent = '';
        if (nextIdx < 0) nextIdx = i;
      }
    }
    this.dom.pp.textContent = '已拾 ' + s.got + '/' + s.frags.length;
    this.dom.promptTxt.textContent = nextIdx < 0 ? '诗成' : s.frags[nextIdx];
  },

  /* ---------- 自动驾驶（仅调试用，用于出验收截图） ---------- */
  autopilot: function () {
    var s = this.st;
    var near = null, pick = null;
    s.lv.ents.forEach(function (e) {
      if (e.skipped || (e.type === 'pickup' && e.taken) || (e.type === 'ob' && e.hit)) return;
      var sx = PLAYER_X + (e.x - s.dist);
      if (sx < PLAYER_X - 40) return;
      if (e.type === 'ob') { if (!near || sx < near.sx) near = { e: e, sx: sx }; }
      else { if (!pick || sx < pick.sx) pick = { e: e, sx: sx }; }
    });
    if (near) {
      if (near.e.ob === 'rock' && near.sx < 232 && s.onGround) this.onJump();
      if (near.e.ob === 'bird' && near.sx < 226 && s.onGround) this.onSlide();
    }
    if (pick && pick.e.kind === 'c' && pick.e.lane === 'high' && pick.sx < 196 && s.onGround) this.onJump();
  },

  finish: function () {
    var s = this.st;
    if (s.done) return;
    s.done = true;
    var acc = s.got / s.frags.length;
    var rank = rankOf(acc, s.mistakes, s.collisions);
    Screens.show('result', {
      poem: s.poem, collected: s.collected, skipped: s.skipped,
      got: s.got, total: s.frags.length,
      mistakes: s.mistakes, collisions: s.collisions,
      acc: acc, rank: rank
    });
  }
};

/* ===== 40-result.js 结算界面 ===== */

var Result = {
  built: false,

  build: function () {
    if (this.built) return;
    var el = Screens.result.el;
    el.innerHTML = '';
    el.appendChild(buildScenery(1).wrap);      // 远景固定 + 一层草地带（结算页静止）
    var veil = mk('div', 'bg');
    veil.style.background = 'linear-gradient(180deg, rgba(252,248,241,.72), rgba(252,248,241,.82) 46%, rgba(250,244,235,.9))';
    el.appendChild(veil);
    el.appendChild(mk('div', 'grain'));

    el.appendChild(mk('div', 'res-title'));
    var fan = mk('div', 'res-fan');
    fan.innerHTML = '<img alt="">';
    el.appendChild(fan);
    var panel = mk('div', 'res-panel');
    panel.innerHTML =
      '<div class="res-poem"><div class="poem-lines"></div><div class="src"></div></div>' +
      '<div class="res-stats">' +
      '  <div class="kv"><span>准确率</span><b class="acc"></b></div>' +
      '  <div class="kv"><span>拼入碎片</span><b class="got"></b></div>' +
      '  <div class="kv"><span>拾错碎片</span><b class="mis"></b></div>' +
      '  <div class="kv"><span>碰撞次数</span><b class="col"></b></div>' +
      '  <div class="kv"><span>最终评级</span><b class="rk"></b></div>' +
      '  <div class="miss-list"></div>' +
      '</div>';
    el.appendChild(panel);
    var again = mk('button', 'res-again', '再玩一次');
    again.onclick = function () { Screens.show('select'); };
    el.appendChild(again);
    el.appendChild(soundBtn());

    this.dom = {
      title: $('.res-title', el), fan: $('.res-fan img', el),
      lines: $('.poem-lines', el), src: $('.src', el),
      acc: $('.acc', el), got: $('.got', el), mis: $('.mis', el),
      col: $('.col', el), rk: $('.rk', el), missList: $('.miss-list', el)
    };
    this.built = true;
  },

  show: function (d) {
    this.build();
    var P = d.poem, R = RANKS[d.rank];
    this.dom.title.innerHTML = '恭喜获得<em>「' + R.name + '」</em>称号';
    this.dom.fan.src = IMGS[R.img];

    /* 每行对应哪些碎片 */
    var lineIdx = [], fi = 0;
    P.lines.forEach(function (L) {
      var idx = [], acc = 0;
      while (acc < L.length && fi < P.frags.length) { idx.push(fi); acc += P.frags[fi].length; fi++; }
      lineIdx.push(idx);
    });

    var missing = [];
    this.dom.lines.innerHTML = P.lines.map(function (L, li) {
      var h = '';
      lineIdx[li].forEach(function (k) {
        var f = P.frags[k];
        if (d.collected[k]) h += f;
        else { h += '<span class="miss">' + f + '</span>'; missing.push(f); }
      });
      return '<div class="ln">' + h + '，</div>';
    }).join('').replace(/，<\/div>$/, '</div>');

    this.dom.src.textContent = '《' + P.title + '》　' + P.dynasty + '·' + P.author;

    var pct = Math.round(d.acc * 100);
    this.dom.acc.textContent = pct + '%';
    this.dom.acc.className = 'acc' + (pct >= 100 ? ' good' : (pct <= 50 ? ' bad' : ''));
    this.dom.got.textContent = d.got + '/' + d.total;
    this.dom.mis.textContent = d.mistakes;
    this.dom.mis.className = 'mis' + (d.mistakes ? ' bad' : '');
    this.dom.col.textContent = d.collisions;
    this.dom.col.className = 'col' + (d.collisions ? ' bad' : '');
    this.dom.rk.textContent = R.name;
    this.dom.rk.className = 'rk' + (d.rank === 2 ? ' good' : (d.rank === 0 ? ' bad' : ''));

    this.dom.missList.innerHTML = missing.length
      ? '缺失碎片：' + missing.map(function (m) { return '<em>' + m + '</em>'; }).join('、')
      : '全诗已圆，一字未失。';

    /* 结算底图使用跑酷场景，避免与用户给的「结算界面」合成图里固定的“知府”扇面冲突 */
  }
};


/* ==================== 50-main.js ==================== */
/* ===== 50-main.js 启动 / 调试直达 / 竖屏提示 ===== */

(function () {
  function rotateHint() {
    var h = $('#rotateHint');
    if (!h) return;
    function upd() {
      var portrait = window.innerHeight > window.innerWidth * 1.05;
      h.classList.toggle('on', portrait && !Store.get('rotateOff', false));
      fitStage();
    }
    h.addEventListener('click', function () { Store.set('rotateOff', true); h.classList.remove('on'); });
    window.addEventListener('resize', upd);
    window.addEventListener('orientationchange', function () { setTimeout(upd, 260); });
    upd();
  }

  function fakeResult() {
    var pi = parseInt(DEBUG.poem || '0', 10) || 0;
    var P = POEMS[pi];
    var total = P.frags.length;
    var got = DEBUG.got != null ? clamp(parseInt(DEBUG.got, 10), 0, total) : total;
    var mis = parseInt(DEBUG.mis || '0', 10) || 0;
    var col = parseInt(DEBUG.col || '0', 10) || 0;
    var acc = got / total;
    var rank = DEBUG.rank != null ? parseInt(DEBUG.rank, 10) : rankOf(acc, mis, col);
    return {
      poem: P, got: got, total: total, mistakes: mis, collisions: col, acc: acc, rank: rank,
      collected: P.frags.map(function (_, i) { return i < got; }),
      skipped: P.frags.map(function () { return false; })
    };
  }

  function boot() {
    stageEl = $('#stage');
    fitStage();
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', function () { setTimeout(fitStage, 260); });
    Input.init();
    Input.onAny = function () { Sfx.unlock(); };

    /* 调试：?resetops=1 清掉"已看过行路操作"的标记 */
    if (DEBUG.resetops) Store.set('seenOps', false);

    /* 调试：?anim=0 关闭全部过渡与动画，保证截图取到稳定终态 */
    if (DEBUG.anim === '0') {
      var s0 = document.createElement('style');
      s0.textContent = '*,*::before,*::after{animation:none!important;transition:none!important}';
      document.head.appendChild(s0);
    }

    buildScreens();
    Result.build();
    Play.build();

    /* 调试：?audio=1 自检程序化音律并把结果打在界面上 */
    if (DEBUG.audio) {
      var r = Sfx.selftest();
      var banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;background:#0b7a3b;color:#fff;' +
        'font:12px/1.5 monospace;padding:3px 8px;white-space:pre';
      banner.textContent = 'AUDIO ' + JSON.stringify(r);
      document.body.appendChild(banner);
      Sfx.init();
      banner.textContent += '  ctx=' + (Sfx.ctx ? Sfx.ctx.state : 'none');
      try { Sfx.chime(0); Sfx.chime(4); banner.textContent += '  chime=ok'; }
      catch (e) { banner.textContent += '  chime=ERR ' + e.message; }
    }

    Screens.reg.play.tick = function (dt) { Play.update(dt); };
    Screens.reg.result.enter = function (o) { Result.show(o); };

    Loop.start();

    var stt = DEBUG.state || 'menu';
    if (stt === 'play') {
      Play.start(parseInt(DEBUG.poem || '0', 10) || 0);
    } else if (stt === 'result') {
      Screens.show('result', fakeResult());
    } else if (stt === 'popup') {
      Screens.show('popup', { poem: parseInt(DEBUG.poem || '0', 10) || 0 });
    } else if (Screens.reg[stt]) {
      Screens.show(stt);
    } else {
      Screens.show('menu');
    }

    rotateHint();
    document.body.classList.add('ready');

    /* 调试：?click=0,0 依次点击当前屏的第 n 个按钮，用于端到端验收
       （例：state=select&click=0,0 → 点第一张卷轴 → 点弹窗的确定 → 进入跑酷） */
    if (DEBUG.click != null) {
      var seq = String(DEBUG.click).split(','), step = 0;
      var doClick = function () {
        if (step >= seq.length) return;
        var btns = $$('#stage .screen.on button');
        var b = btns[parseInt(seq[step], 10) || 0];
        step++;
        if (b) b.click();
        setTimeout(doClick, 150);
      };
      setTimeout(doClick, 150);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
